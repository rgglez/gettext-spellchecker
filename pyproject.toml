[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gettext-spellchecker"
dynamic = ["version"]
description = "Check the spelling of msgid or msgstr strings in gettext .po and .pot files using hunspell dictionaries."
authors = [{ name = "Rodolfo González González", email = "code@rodolfo.gg" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["gettext", "po", "pot", "spellcheck", "hunspell", "i18n", "l10n"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "polib>=1.2",
    "hunspell>=0.5.5",
    "colorama>=0.4",
]

[project.scripts]
gettext-spellchecker = "gettext_spellchecker.check:main"

[project.urls]
Homepage = "https://github.com/rgglez/gettext-spellchecker"
Issues = "https://github.com/rgglez/gettext-spellchecker/issues"

[tool.setuptools.dynamic]
version = { attr = "gettext_spellchecker.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
