name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # libhunspell-dev to compile the hunspell module, dictionaries for the tests
      - run: sudo apt-get update && sudo apt-get install -y libhunspell-dev hunspell-de-de hunspell-en-us
      - run: pip install . pytest flake8
      - run: flake8 src tests
      - run: pytest
